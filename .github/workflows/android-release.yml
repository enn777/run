name: Android Release

on:
  push:
    tags:
      - 'v*-android.*'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          cmdline-tools-version: 12266719

      - name: Install Android SDK components
        shell: pwsh
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"

      - name: Restore signing key
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_BASE64)) {
            throw 'Missing repository secret ANDROID_KEYSTORE_BASE64'
          }
          New-Item -ItemType Directory -Force android/.signing | Out-Null
          [IO.File]::WriteAllBytes('android/.signing/local-test.keystore', [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))

      - name: Build signed APK
        shell: pwsh
        run: .\android\build.ps1 -SdkPath "$env:ANDROID_HOME" -Abi arm64-v8a -Profile release

      - name: Prepare release asset
        shell: pwsh
        run: Copy-Item .\android\build\arm64-v8a-release\NekoSportsWorldTool-arm64-v8a.apk .\android\build\NekoSportsWorldTool-android-arm64.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: android/build/NekoSportsWorldTool-android-arm64.apk
